# CI de AmWF: el chequeo local completo del repo, ejecutado en cada push a
# main y en cada pull request.
#
#   ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
#
# El APK debug queda como artefacto descargable de la propia run. Los binarios
# nativos son assets precompilados: no se necesita NDK. Los runners de GitHub
# traen el SDK de Android preinstalado con las licencias aceptadas
# (ANDROID_HOME=/usr/local/lib/android/sdk); AGP descarga solo la plataforma
# (37.1) y build-tools que falten.
#
# Nota 16 KB: el chequeo de alineación es BLOQUEANTE. Los assets arm64 están
# recompilados con scripts/build-wifi-binaries.sh (NDK r27,
# -Wl,-z,max-page-size=16384) y cualquier ELF que vuelva a salir alineado a
# 4 KB debe cortar la run: Play rechazaría el upload.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancela runs obsoletas de la misma rama/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests JVM, lint y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # El daemon de Gradle exige Java 21 (gradle/gradle-daemon-jvm.properties).
      - name: JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle con caché
        uses: gradle/actions/setup-gradle@v6

      # El SDK preinstalado del runner (licencias ya aceptadas) basta: AGP
      # auto-descarga platform 37.1 y build-tools al primer build.
      - name: Chequeo completo (tests + lint + APK)
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      # Bloqueante: los ELF arm64 deben alinear sus LOAD a 16 KB (requisito
      # Play desde 2025-11-01). Véase BINARIES_SETUP.md §7.
      - name: Alineación 16 KB de los binarios empaquetados
        run: |
          set -u
          fails=0
          for f in pixiewps wpa_supplicant wpa_cli libnl-3.so.200 libnl-genl-3.so.200; do
            align="$(readelf -lW "app/src/main/assets/wifi/$f" \
              | awk '$1 == "LOAD" { print $NF; exit }')"
            if [[ "$align" != "0x4000" ]]; then
              echo "::error file=app/src/main/assets/wifi/$f::$f alineado a ${align:-?}; se exige 0x4000 (16 KB)"
              fails=1
            else
              echo "[16KB] OK: $f (LOAD align 0x4000)"
            fi
          done
          if [[ "$fails" -ne 0 ]]; then
            echo "::error::Assets arm64 sin alinear a 16 KB: Play rechazará el upload (ver BINARIES_SETUP.md §7). Recompilar con scripts/build-wifi-binaries.sh."
            exit 1
          fi

      - name: Subir APK debug
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Subir reportes al fallar
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
